# Local MySQL for development.
# Credentials come from the ".env" file next to this one
# (copy ".env.example" to ".env" first).
services:

  mysql:
    image: mysql:8.4
    container_name: financiaplus-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: financiaplus
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    ports:
      - "3306:3306"

    volumes:
      - financiaplus_mysql_data:/var/lib/mysql

volumes:
  financiaplus_mysql_data:
