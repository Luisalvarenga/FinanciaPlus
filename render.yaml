# Render blueprint for the FinanciaPlus API.
#
# In Render: New > Blueprint, pick this repository and fill in the
# values marked "sync: false" (they are never stored in the repo).
services:
  - type: web
    name: financiaplus-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      # JDBC URL of the MySQL database, for example:
      # jdbc:mysql://HOST:PORT/DATABASE?sslMode=REQUIRED
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Signing key for the JWT tokens, generated by Render.
      - key: JWT_SECRET
        generateValue: true
      # Password of the demo accounts created on first start.
      - key: SEED_DEFAULT_PASSWORD
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
      # Render terminates HTTPS, so the original protocol and the
      # client IP arrive in the X-Forwarded-* headers.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
