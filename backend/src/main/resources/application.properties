spring.application.name=backend

# Credentials are never written in this file. They come from
# environment variables: on your machine from the ".env" file at
# the repository root (see ".env.example"), and in production from
# the hosting platform. The backend does not start without them.

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ==========================================
# SERVER
# ==========================================
# Hosting platforms such as Render provide the port in PORT.

server.port=${PORT:8080}

# Behind a reverse proxy set FORWARD_HEADERS_STRATEGY=framework so the
# original protocol (HTTPS) and client IP are taken from its headers.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financiaplus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# REQUEST IP
# ==========================================

app.request-ip.allow-forwarded-for=true
app.request-ip.development-fallback-ip=8.8.8.8

# ==========================================
# RISK SCORING
# ==========================================
# ISO country code considered local by the internal risk scoring.

app.risk.home-country=SV

# ==========================================
# SECURITY
# ==========================================
# JWT_SECRET signs the tokens and needs at least 32 characters.

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Password shared by the accounts created by DataSeeder.
app.seed.default-password=${SEED_DEFAULT_PASSWORD}
